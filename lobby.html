<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>انتخاب حالت بازی | خانه بازی</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#e1f7ff,#fffaf0);font:15px/1.9 Tahoma;color:#15344a;min-height:100dvh;display:grid;place-items:center;padding:18px}main{width:min(540px,100%);background:white;border-radius:26px;padding:25px;box-shadow:0 20px 65px #082f4922}h1{font-size:24px}button,input,a{font:inherit}button{width:100%;border:1px solid #dcecf2;background:#f1f9fc;color:inherit;min-height:65px;border-radius:15px;margin:5px 0;text-align:right;padding:12px 16px;cursor:pointer}button:disabled{opacity:.5}small{display:block;color:#6b8190;font-size:11px}input{width:100%;min-height:48px;border:1px solid #b8cdd9;border-radius:12px;padding:10px;direction:ltr;text-align:center}a{color:#087ca7}#code{font-size:27px;letter-spacing:3px;direction:ltr;text-align:center}#message{color:#075985;white-space:pre-wrap}#cancel{display:none}footer{font-size:11px;color:#6b8190}</style><link rel="stylesheet" href="lobby.css"><link rel="stylesheet" href="lobby-plaza.css"><link rel="icon" type="image/svg+xml" href="icon.svg"><link rel="stylesheet" href="house.css"><link rel="stylesheet" href="palette.css"><script src="palette.js"></script></head><body class="palette-lobby"><main><a href="arcade.html">← کتابخانه</a><h1 id="title">چطور بازی کنیم؟</h1><p class="step-note">قدم 2 از 2 · حریف خود را انتخاب کنید</p><div id="options"><h2 class="mode-heading">بدون اینترنت</h2><button data-mode="ai">🤖 با کامپیوتر<small>بدون اینترنت · انتخاب سختی در تنظیمات بازی</small></button><button data-mode="local">👥 دونفره روی یک دستگاه<small>به‌نوبت با همین موبایل یا کامپیوتر بازی کنید</small></button><h2 class="mode-heading">بازی از راه دور</h2><button data-mode="random">🌍 حریف تصادفی<small>اتصال به بازیکن منتظر همین بازی</small></button><button data-mode="host">🔑 ساخت اتاق خصوصی<small>کد اتاق را برای دوستتان بفرستید</small></button><label id="roomCodeLabel" for="roomCode">کد دعوت دارید؟ اینجا وارد کنید</label><input autocapitalize="characters" autocomplete="off" spellcheck="false" enterkeyhint="go" id="roomCode" maxlength="8" placeholder="کد 8 حرفی اتاق" aria-label="کد اتاق"><button data-mode="join">ورود با کد دعوت</button></div><p id="message" role="status"></p><div id="code"></div><button id="copyCode" hidden>کپی کد دعوت</button><p id="waitTime" hidden></p><button id="cancel">برگشت و لغو انتظار</button><footer>بازی آنلاین نیازمند اتصال اینترنت و روشن‌بودن سرور سایت است.</footer></main><script>
 const allowed={'santorini':'سانتورینی','quoridor-studio.html':'کوریدور','blokus-duo-studio.html':'بلوکوس','gobblet-studio.html':'گابلت','onitama-studio.html':'اونیتاما','quarto-studio.html':'کوارتو','ludo.html':'منچ','snakes.html':'مار و پله','morris.html':'دوز 9 مهره‌ای','connect4.html':'چهار در خط','reversi.html':'اتللو','checkers.html':'داما','backgammon.html':'تخته‌نرد','domino.html':'دومینو'},game=new URLSearchParams(location.search).get('game');if(!Object.hasOwn(allowed,game))location.replace('arcade.html');document.querySelector('#title').textContent=allowed[game]+' · انتخاب حالت';if(['ludo.html','snakes.html'].includes(game)){document.querySelector('[data-mode=local] small').textContent='2 یا 4 نفر؛ تعداد را از «بازی جدید» داخل میز انتخاب کنید';document.querySelector('footer').textContent='آنلاین این بازی‌ها دونفره است؛ تاس در سرور انداخته می‌شود. برای آنلاین اتصال و سرور لازم است.';}let session=null,stopped=false;
 const message=document.querySelector('#message');const go=params=>location.href='player.html?game='+encodeURIComponent(game)+'&'+params;
 let previous;try{previous=JSON.parse(localStorage.getItem('net-resume-'+game))}catch{}if(previous?.token){const resume=document.createElement('button');resume.textContent='↶ ادامهٔ مسابقهٔ آنلاین · '+previous.code;document.querySelector('#options').prepend(resume);resume.onclick=async()=>{try{await call('poll',{token:previous.token});sessionStorage.setItem('net-session',JSON.stringify(previous));go('online=1')}catch{localStorage.removeItem('net-resume-'+game);resume.remove();message.textContent='این اتاق دیگر در دسترس نیست؛ یک مسابقهٔ تازه بسازید.'}}}
 async function call(path,data){const r=await fetch('/api/'+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data),signal:typeof AbortSignal!=='undefined'&&AbortSignal.timeout?AbortSignal.timeout(12000):undefined});let b;try{b=await r.json()}catch{throw Error('سرور آنلاین پاسخ معتبری نداد. بازی محلی و کامپیوتر همچنان در دسترس‌اند.')}if(!r.ok)throw Error(b.error||'اتصال به سرور آنلاین ناموفق بود.');return b}
 document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=async()=>{const mode=b.dataset.mode;if(mode==='ai'||mode==='local'){go('playmode='+mode);return}if(location.protocol==='file:'){message.textContent='برای بازی آنلاین سایت را با npm start روی سرور اجرا کنید.';return}document.querySelectorAll('[data-mode]').forEach(x=>x.disabled=true);message.textContent='در حال اتصال…';try{session=await call('rooms',{game,mode,code:document.querySelector('#roomCode').value.trim()});sessionStorage.setItem('net-session',JSON.stringify(session));try{localStorage.setItem('net-resume-'+game,JSON.stringify(session))}catch{}document.querySelector('#options').hidden=true;document.querySelector('#cancel').style.display='block';document.querySelector('#code').textContent=session.code;message.textContent=mode==='random'?'در انتظار حریف تصادفی…':'کد بالا را برای دوستتان بفرستید؛ او همین بازی را انتخاب و کد را وارد کند.';poll()}catch(e){message.textContent=e.name==='TimeoutError'||e.name==='AbortError'?'زمان اتصال تمام شد؛ دوباره تلاش کنید. بازی محلی و کامپیوتر در دسترس‌اند.':e.message==='Failed to fetch'?'ارتباط با سرور آنلاین برقرار نشد. بازی محلی و کامپیوتر در دسترس‌اند.':e.message;document.querySelectorAll('[data-mode]').forEach(x=>x.disabled=false)}});
 async function poll(){if(stopped)return;try{const s=await call('poll',{token:session.token});if(s.ready){go('online=1');return}}catch(e){message.textContent='ارتباط قطع شد؛ تلاش مجدد…'}setTimeout(poll,1000)}document.querySelector('#cancel').onclick=async()=>{stopped=true;try{await call('leave',{token:session.token})}catch{}sessionStorage.removeItem('net-session');localStorage.removeItem('net-resume-'+game);location.reload()};
 const codeInput=document.querySelector('#roomCode'),copy=document.querySelector('#copyCode');codeInput.addEventListener('input',()=>codeInput.value=codeInput.value.replace(/[^a-f0-9]/gi,'').toUpperCase());codeInput.addEventListener('keydown',e=>{if(e.key==='Enter')document.querySelector('[data-mode="join"]').click()});
 document.addEventListener('click',e=>{if(e.target.closest('[data-mode="join"]')&&!/^[A-F0-9]{8}$/i.test(codeInput.value.trim())){e.preventDefault();e.stopImmediatePropagation();message.textContent='کد دعوت 8 حرفی را کامل وارد کنید.';codeInput.setAttribute('aria-invalid','true');codeInput.focus()}},true);
 let waitStart=0;setInterval(()=>{const active=document.querySelector('#options').hidden;copy.hidden=!active;const timer=document.querySelector('#waitTime');timer.hidden=!active;if(active){waitStart=waitStart||Date.now();timer.textContent='زمان انتظار: '+Math.floor((Date.now()-waitStart)/1000).toLocaleString('en-US')+' ثانیه'}},1000);copy.onclick=async()=>{try{await navigator.clipboard.writeText(session.code);copy.textContent='✓ کد کپی شد'}catch{message.textContent='کد را لمس و نگه دارید، سپس کپی کنید.'}};
 </script><script src="house-data.js"></script><script src="house-admin-demo-config.js"></script><script src="house-public.js"></script></body></html>
