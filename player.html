<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>خانه بازی | بازی</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f0e8;font-family:Tahoma,sans-serif;height:100dvh;display:flex;flex-direction:column}header{display:flex;align-items:center;gap:12px;min-height:56px;padding:max(6px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) 6px max(10px,env(safe-area-inset-left));background:#082f49;color:white}a,button{color:inherit;font:inherit;font-size:12px;border:0;background:#ffffff18;padding:12px;border-radius:10px;text-decoration:none}strong{font-size:13px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}a,button{min-height:44px;display:flex;align-items:center;justify-content:center;touch-action:manipulation}#modeLink{font-size:11px}#status{font-size:11px;padding:6px 12px;background:#e8f3f5;text-align:center;line-height:1.7}#status:empty{display:none}@media(max-width:370px){header{gap:5px}a,button{padding:10px 8px}strong{font-size:11px}}iframe{border:0;width:100%;flex:1;min-height:0}button{cursor:pointer}</style><link rel="stylesheet" href="player-plaza.css"><link rel="icon" type="image/svg+xml" href="icon.svg"><link rel="stylesheet" href="palette.css"><script src="palette.js"></script></head><body class="palette-player"><header><a href="arcade.html">← خانه</a><strong id="title">بازی</strong><a id="modeLink">حالت بازی</a><button id="full" aria-label="تمام‌صفحه">تمام‌صفحه</button></header><div id="status" role="status" aria-live="polite"></div><iframe title="بازی" allow="fullscreen; autoplay" id="game"></iframe><script src="house-data.js"></script><script src="house-shell.js"></script><script>const catalog={'santorini':'سانتورینی','quoridor-studio.html':'کوریدور استودیو','quoridor-3d.html':'کوریدور سه‌بعدی','blokus-duo-studio.html':'بلوکوس دونفره','gobblet-studio.html':'گابلت','onitama-studio.html':'اونیتاما','quarto-studio.html':'کوارتو','ludo.html':'منچ','snakes.html':'مار و پله','morris.html':'دوز 9 مهره‌ای','connect4.html':'چهار در خط','reversi.html':'اتللو','checkers.html':'داما','backgammon.html':'تخته‌نرد','domino.html':'دومینو'};const key=new URLSearchParams(location.search).get('game');if(Object.hasOwn(catalog,key)){const q=new URLSearchParams(location.search);q.delete('game');document.querySelector('#game').src=(key==='santorini'?'index.html':'games/'+key)+'?'+q.toString();document.querySelector('#title').textContent=catalog[key];document.querySelector('#modeLink').href='lobby.html?game='+encodeURIComponent(key==='quoridor-3d.html'?'quoridor-studio.html':key);document.title=catalog[key]+' | خانه بازی';const clean=new URL(location.href);clean.searchParams.delete('playmode');if(key==='santorini')clean.searchParams.set('resume','1');history.replaceState(null,'',clean)}else location.replace('arcade.html');document.querySelector('#full').onclick=()=>document.querySelector('#game').requestFullscreen?.().catch(()=>{});window.addEventListener('message',e=>{if(e.origin===location.origin&&e.source===document.querySelector('#game').contentWindow&&e.data?.type==='network-status')document.querySelector('#status').textContent=e.data.text});</script><script src="game-results.js"></script></body></html>
